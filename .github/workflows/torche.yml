name: Compiler APK Torche

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Décompresser le projet
        run: |
          mkdir -p projet
          unzip -o torche-projet.zip -d projet

      - name: Compiler l'APK
        working-directory: projet
        run: gradle assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: torche-apk
          path: projet/app/build/outputs/apk/debug/app-debug.apk
